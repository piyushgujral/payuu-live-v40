name: Fix Recent Supporters Text

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fix supporter feed rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text()
          marker = '/* PAYUU LIVE SUPPORTER FEED VISIBILITY FIX */'
          if marker not in s:
              s += '''\n\n/* PAYUU LIVE SUPPORTER FEED VISIBILITY FIX */\n.supporters-feed {\n    display: flex;\n    flex-direction: column;\n    gap: 10px;\n    max-height: 280px;\n    overflow-y: auto;\n    overflow-x: hidden;\n    padding: 2px 0;\n}\n\n.feed-card {\n    width: 100%;\n    min-height: 42px;\n    flex: 0 0 auto;\n    overflow: visible;\n}\n\n.feed-card-header {\n    min-height: 42px;\n    height: auto;\n    padding: 8px 12px;\n    gap: 12px;\n    line-height: 1.25;\n    overflow: visible;\n}\n\n.feed-card-user {\n    display: block;\n    flex: 1 1 auto;\n    min-width: 0;\n    color: #FFFFFF;\n    font-family: var(--font-body);\n    font-size: 0.85rem;\n    font-weight: 700;\n    line-height: 1.25;\n    white-space: normal;\n    overflow: visible;\n    text-overflow: clip;\n    word-break: break-word;\n}\n\n.feed-card-amount {\n    flex: 0 0 auto;\n    white-space: nowrap;\n    line-height: 1.25;\n}\n\n.feed-card-body {\n    line-height: 1.35;\n    overflow-wrap: anywhere;\n}\n'''
              p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: make recent supporter names visible"
          git push
