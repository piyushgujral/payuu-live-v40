<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payuu Live | Stream Alert Overlay</title>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Canvas Confetti Engine -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --gold-primary: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --gold-grad: linear-gradient(135deg, #FFE866 0%, #FFA800 100%);
            --white: #FFFFFF;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #overlay-stage {
            position: relative;
            width: 100%;
            max-width: 580px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
        }

        /* HARDWARE ACCELERATED STREAMLABS-LEVEL ALERT CARD */
        .alert-card {
            background: rgba(7, 25, 47, 0.94);
            border: 2px solid var(--gold-primary);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 35px var(--gold-glow), inset 0 0 15px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translate3d(0, 100px, 0) scale(0.8);
            pointer-events: none;
            will-change: transform, opacity;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }

        .alert-card.active {
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            pointer-events: auto;
        }

        .alert-card.exiting {
            opacity: 0;
            transform: translate3d(0, -80px, 0) scale(0.9);
            transition: transform 0.5s ease-in-out, opacity 0.5s ease;
        }

        .logo-aura-wrapper {
            position: relative;
            width: 110px; height: 110px;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gold-ring-spin {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px dashed var(--gold-primary);
            box-shadow: 0 0 20px var(--gold-glow);
            animation: spinRing 10s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert-logo-img {
            width: 82%; height: 82%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold-primary);
            box-shadow: 0 0 25px var(--gold-glow);
            z-index: 2;
        }

        .supporter-header {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--white);
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .amount-banner-pill {
            display: inline-block;
            background: var(--gold-grad);
            color: #030B17;
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 900;
            padding: 6px 24px;
            border-radius: 30px;
            box-shadow: 0 0 25px var(--gold-glow);
            margin-bottom: 14px;
        }

        .message-speech-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            padding: 12px 18px;
            color: var(--white);
            font-size: 1rem;
            margin-bottom: 14px;
            word-break: break-word;
        }

        /* OVERLAY GOAL PROGRESS BAR */
        .overlay-goal-box {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .overlay-goal-bar-outer {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .overlay-goal-bar-inner {
            height: 100%;
            width: 0%;
            background: var(--gold-grad);
            transition: width 1s ease;
        }
    </style>
</head>
<body>

    <div id="overlay-stage">
        <div class="alert-card" id="alert-card">
            <div class="logo-aura-wrapper">
                <div class="gold-ring-spin"></div>
                <img src="assets/images/logo.png" alt="Payuu Live Logo" class="alert-logo-img" id="alert-logo">
            </div>

            <div class="supporter-header" id="alert-name">GamerX</div>
            <div class="amount-banner-pill" id="alert-amount">₹500</div>
            
            <div class="message-speech-box" id="alert-message">
                "Keep up the awesome streams!"
            </div>

            <div class="overlay-goal-box" id="overlay-goal-box" style="display: none;">
                <div style="font-size: 0.72rem; color: var(--gold-primary); margin-bottom: 4px; font-weight: 700;">
                    MONTHLY GOAL PROGRESS: <span id="overlay-goal-pct">0%</span>
                </div>
                <div class="overlay-goal-bar-outer">
                    <div class="overlay-goal-bar-inner" id="overlay-goal-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script src="firebase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/overlay.js"></script>
</body>
</html>
