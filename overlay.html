<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payuu Live | Browser Stream Overlay</title>

    <!-- Google Fonts: Orbitron & Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Canvas Confetti Engine -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-navy: #07192F;
            --bg-royal: #0B2B4A;
            --gold-primary: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --gold-grad: linear-gradient(135deg, #FFE866 0%, #FFA800 100%);
            --pink-neon: #FF007F;
            --cyan-neon: #00F0FF;
            --white: #FFFFFF;
            --text-sub: #A0B3C6;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            overflow: hidden;
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #overlay-stage {
            position: relative;
            width: 100%;
            max-width: 580px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alert-card {
            background: rgba(7, 25, 47, 0.92);
            border: 2px solid var(--gold-primary);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 35px var(--gold-glow), inset 0 0 15px rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(100px) scale(0.8);
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .alert-card.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .alert-card.exiting {
            opacity: 0;
            transform: translateY(-80px) scale(0.9);
            transition: all 0.5s ease-in-out;
        }

        .alert-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.15), transparent);
            transform: rotate(45deg);
            animation: sweepGlow 3s infinite linear;
        }

        @keyframes sweepGlow {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .logo-aura-wrapper {
            position: relative;
            width: 110px; height: 110px;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gold-ring-spin {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px dashed var(--gold-primary);
            box-shadow: 0 0 20px var(--gold-glow);
            animation: spinRing 10s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert-logo-img {
            width: 82%; height: 82%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--gold-primary);
            box-shadow: 0 0 25px var(--gold-glow);
            z-index: 2;
        }

        .supporter-header {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--white);
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .amount-banner-pill {
            display: inline-block;
            background: var(--gold-grad);
            color: #030B17;
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 900;
            padding: 6px 24px;
            border-radius: 30px;
            box-shadow: 0 0 25px var(--gold-glow);
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .message-speech-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            padding: 12px 18px;
            color: var(--white);
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 14px;
            word-break: break-word;
            line-height: 1.4;
        }

        .thankyou-footer {
            font-size: 0.82rem;
            color: var(--cyan-neon);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            #overlay-stage { padding: 10px; }
            .alert-card { padding: 20px; border-radius: 18px; }
            .supporter-header { font-size: 1.4rem; }
            .amount-banner-pill { font-size: 1.3rem; padding: 4px 18px; }
            .message-speech-box { font-size: 0.88rem; }
        }
    </style>
</head>
<body>

    <div id="overlay-stage">
        <div class="alert-card" id="alert-card">
            <div class="logo-aura-wrapper">
                <div class="gold-ring-spin"></div>
                <img src="assets/images/logo.png" alt="Payuu Live Logo" class="alert-logo-img" id="alert-logo">
            </div>

            <div class="supporter-header" id="alert-name">GamerX</div>
            <div class="amount-banner-pill" id="alert-amount">₹500</div>
            
            <div class="message-speech-box" id="alert-message">
                "Keep up the awesome streams!"
            </div>

            <div class="thankyou-footer">
                ❤️ Thank you for supporting Payuu Live! ❤️
            </div>
        </div>
    </div>

   <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>

<!-- Firebase Configuration -->
<script src="firebase.js"></script>

    <script>
        /* ====================================================
           PAYUU LIVE OVERLAY QUEUE & AI VOICE SYNTHESIZER
           ==================================================== */

        const overlayQueue = [];
        let isDisplayingAlert = false;
        let siteSettings = {
            voice: {
                enabled: true,
                gender: "female",
                language: "en-IN",
                volume: 0.9,
                pitch: 1.0,
                rate: 1.0
            }
        };

        // Listen for Realtime Settings Configuration
        if (window.firebaseDB && window.firebaseDB.listenSettings) {
            window.firebaseDB.listenSettings((s) => {
                if (s) {
                    siteSettings = { ...siteSettings, ...s };
                    if (s.logoUrl) {
                        const logoEl = document.getElementById('alert-logo');
                        if (logoEl) logoEl.src = s.logoUrl;
                    }
                }
            });
        }

        // Web Audio Synthesizer: Chime
        function playAlertChime() {
            try {
                if (siteSettings.overlay && siteSettings.overlay.sound === false) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(880, ctx.currentTime);
                gain1.gain.setValueAtTime(0.35 * (siteSettings.overlay?.volume || 0.8), ctx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start();
                osc1.stop(ctx.currentTime + 0.8);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.15);
                gain2.gain.setValueAtTime(0.4 * (siteSettings.overlay?.volume || 0.8), ctx.currentTime + 0.15);
                gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(ctx.currentTime + 0.15);
                osc2.stop(ctx.currentTime + 1.25);
            } catch (err) {}
        }

        function triggerConfettiBurst() {
            try {
                if (siteSettings.overlay && siteSettings.overlay.confetti === false) return;
                confetti({
                    particleCount: 70,
                    spread: 80,
                    origin: { y: 0.5 },
                    colors: ['#FFD700', '#FF007F', '#00F0FF', '#FFFFFF']
                });
            } catch (err) {}
        }

// VOICE / TTS ENGINE
function speakAlertVoice(item, onComplete) {
    const done = typeof onComplete === "function" ? onComplete : () => {};

    // Recorded supporter voice is handled separately.
    if (item?.voiceUrl && item.voiceEnabled === true && item.voiceStatus !== "rejected") {
        done();
        return;
    }

    const message = item?.msg ? String(item.msg).trim() : "";

    // Nothing to speak.
    if (!message) {
        done();
        return;
    }

    if (!("speechSynthesis" in window)) {
        done();
        return;
    }

    if (siteSettings.voice && siteSettings.voice.enabled === false) {
        done();
        return;
    }

    const name = item.name || "A Supporter";
    const amount = item.amount || 0;
    const lang = siteSettings.voice?.language || "en-IN";

    let speechText = "";

    if (lang.toLowerCase().startsWith("hi")) {
        speechText = `${name} ने ${amount} रुपये का सपोर्ट किया। संदेश: ${message}`;
    } else {
        speechText = `New Support! ${name} supported ${amount} rupees. Message: ${message}`;
    }

    const speak = () => {
        try {
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(speechText);

            utterance.lang = lang;
            utterance.volume =
                siteSettings.voice?.volume !== undefined
                    ? Number(siteSettings.voice.volume)
                    : 0.9;

            utterance.rate =
                siteSettings.voice?.rate !== undefined
                    ? Number(siteSettings.voice.rate)
                    : 1.0;

            utterance.pitch =
                siteSettings.voice?.gender === "male"
                    ? Number(siteSettings.voice?.pitch || 0.8)
                    : Number(siteSettings.voice?.pitch || 1.2);

            const voices = window.speechSynthesis.getVoices();

            const languageBase = lang.split("-")[0].toLowerCase();

            const matchedVoice =
                voices.find(v => v.lang.toLowerCase() === lang.toLowerCase()) ||
                voices.find(v => v.lang.toLowerCase().startsWith(languageBase));

            if (matchedVoice) {
                utterance.voice = matchedVoice;
            }

            let completed = false;

            const finish = () => {
                if (completed) return;
                completed = true;
                done();
            };

            utterance.onend = finish;
            utterance.onerror = finish;

            window.speechSynthesis.speak(utterance);

            // Safety fallback in case Chrome fails to fire onend.
            setTimeout(() => {
                if (window.speechSynthesis.speaking === false) {
                    finish();
                }
            }, Math.max(10000, speechText.length * 120));

        } catch (error) {
            console.error("TTS error:", error);
            done();
        }
    };

    // Chrome may not have loaded voices when the page first opens.
    const voices = window.speechSynthesis.getVoices();

    if (voices.length > 0) {
        setTimeout(speak, 700);
    } else {
        const oldHandler = window.speechSynthesis.onvoiceschanged;

        window.speechSynthesis.onvoiceschanged = () => {
            if (oldHandler) oldHandler();

            window.speechSynthesis.onvoiceschanged = oldHandler;
            setTimeout(speak, 300);
        };

        // Fallback if Chrome doesn't fire voiceschanged.
        setTimeout(() => {
            if (!window.speechSynthesis.speaking) {
                speak();
            }
        }, 1500);
    }
}
        function processNextAlert() {
            if (isDisplayingAlert || overlayQueue.length === 0) return;

            isDisplayingAlert = true;
            const currentItem = overlayQueue.shift();

            const card = document.getElementById('alert-card');
            const nameEl = document.getElementById('alert-name');
            const amountEl = document.getElementById('alert-amount');
            const msgEl = document.getElementById('alert-message');

            nameEl.textContent = currentItem.name || "Anonymous";
            amountEl.textContent = `₹${Number(currentItem.amount || 0).toLocaleString()}`;
            
            if (currentItem.msg && currentItem.msg.trim()) {
                msgEl.style.display = "block";
                msgEl.textContent = `"${currentItem.msg}"`;
            } else {
                msgEl.style.display = "none";
            }

            playAlertChime();
            triggerConfettiBurst();

            card.classList.remove('exiting');
            card.classList.add('active');

            // Speak Voice
            speakAlertVoice(currentItem, () => {
                // Voice finishes
            });

            const displayDuration = (siteSettings.overlay?.duration || 6) * 1000;

            setTimeout(() => {
                card.classList.remove('active');
                card.classList.add('exiting');

                setTimeout(() => {
                    if (window.firebaseDB && window.firebaseDB.removeOverlayAlert && currentItem._key) {
                        window.firebaseDB.removeOverlayAlert(currentItem._key);
                    }
                    isDisplayingAlert = false;
                    processNextAlert();
                }, 600);
            }, displayDuration);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.firebaseDB && !window.firebaseDB.removeOverlayAlert) {
                window.firebaseDB.removeOverlayAlert = function(key) {
                    if (firebase && firebase.database) {
                        return firebase.database().ref("overlayQueue/" + key).remove();
                    }
                };
            }

            if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
            }

            if (window.firebaseDB) {
                window.firebaseDB.listenOverlay((data, key) => {
                    if (data) {
                        overlayQueue.push({ ...data, _key: key });
                        processNextAlert();
                    }
                });
            }
        });
    </script>
</body>
</html>
